bio:
  - >-
    I am an Assistant Professor in the Department of Mathematics and Statistics at
    McGill University. Previously, I was a Postdoctoral Fellow at the University of
    Ottawa, working with David Haziza.
  - >-
    I completed my Ph.D. in Mathematics at the Laboratoire de Mathématiques de Besançon
    (Université de Bourgogne Franche-Comté), supervised by
    Camelia Goga and David Haziza. I defended my thesis,
    [*Statistical learning for high-dimensional sampling*](files/these.pdf), on July 12, 2022.
    My doctoral work was funded by the Région Franche-Comté and
    [Médiamétrie](https://www.mediametrie.fr/en).

